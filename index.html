<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Christmas List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1ec;--card:#fff;--ink:#1c2b27;--mute:#5d6b66;--line:#d5dcd6;--pine:#1f4a3d;--berry:#a3293f;--on-pine:#fff;--done:#e3e9e4}
@media (prefers-color-scheme:dark){:root{--bg:#121a17;--card:#1a2420;--ink:#e8eee9;--mute:#9aa9a2;--line:#2c3a34;--pine:#7fc4a8;--berry:#e8798c;--on-pine:#10201a;--done:#16201c}}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,sans-serif;padding:max(20px,env(safe-area-inset-top)) 16px 64px}
main{max-width:720px;margin:0 auto}
h1{font:700 2.4rem/1.1 Fraunces,Georgia,serif;margin:24px 0 4px;color:var(--pine)}
.sub{color:var(--mute);margin:0 0 20px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
input,textarea,button{font:inherit;color:inherit}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.bar input{flex:1 1 180px;width:auto}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:10px 14px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--pine);color:var(--on-pine)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 14px;cursor:pointer}
.btn.primary{background:var(--berry);border-color:var(--berry);color:#fff;font-weight:600}
.btn.danger{color:var(--berry)}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--pine);outline-offset:2px}
.totals{display:flex;gap:20px;margin:0 0 12px;color:var(--mute);font-size:.95rem}
.totals b{color:var(--ink)}
#people{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
#people button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;cursor:pointer}
#people button[aria-pressed=true]{background:var(--pine);color:var(--on-pine);border-color:var(--pine)}
#people .new{border-style:dashed;color:var(--mute)}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:14px 4px;border-bottom:1px solid var(--line)}
li.done{background:var(--done)}
li.done .name{text-decoration:line-through;color:var(--mute)}
.chk{width:24px;height:24px;margin-top:2px;accent-color:var(--pine);cursor:pointer}
.name{font:500 1.1rem/1.3 Fraunces,Georgia,serif}
.meta{color:var(--mute);font-size:.92rem}
.meta a{color:var(--pine)}
.price{font-weight:600;white-space:nowrap}
.edit{border:0;background:none;color:var(--mute);cursor:pointer;padding:0;font-size:.9rem;text-decoration:underline}
.empty{padding:32px 0;color:var(--mute)}
#msg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}
#msg.show{opacity:1}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(440px,calc(100% - 24px));padding:20px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog label{display:block;margin:12px 0 4px;font-weight:500;font-size:.92rem}
.row{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}
.row .del{margin-right:auto}
.inl{display:flex;align-items:center;gap:8px;margin-top:14px}
.inl input{width:auto}
@media (prefers-reduced-motion:reduce){#msg{transition:none}}
</style>
</head>
<body>
<main>
  <h1 id="title">Christmas List</h1>
  <p class="sub" id="sub">Tick a gift once it is bought. Tap Edit to change anything.</p>
  <div id="people" role="group" aria-label="People"></div>
  <div class="bar">
    <input id="q" type="search" placeholder="Search gifts" aria-label="Search gifts">
    <div class="seg" role="group" aria-label="Filter">
      <button data-f="all" aria-pressed="true">All</button>
      <button data-f="todo" aria-pressed="false">To buy</button>
      <button data-f="done" aria-pressed="false">Bought</button>
    </div>
    <button class="btn primary" id="add">Add gift</button>
  </div>
  <p class="totals"><span>Still to buy: <b id="t-left">$0</b></span><span>Bought: <b id="t-done">$0</b></span></p>
  <ul id="list"></ul>
  <p class="empty" id="empty" hidden>No gifts match. Add one with Add gift.</p>
</main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2 id="dtitle" style="margin:0;font:700 1.3rem Fraunces,Georgia,serif">Add gift</h2>
    <label for="f-name">Gift name</label><input id="f-name" required>
    <label for="f-price">Approx. price</label><input id="f-price" inputmode="decimal" placeholder="20.00">
    <label for="f-link">Link</label><input id="f-link" placeholder="Paste a link (optional)">
    <label for="f-notes">Notes</label><textarea id="f-notes" rows="2"></textarea>
    <div class="inl"><input id="f-bought" type="checkbox"><label for="f-bought" style="margin:0">Bought</label></div>
    <div class="row">
      <button type="button" class="btn danger del" id="del">Delete</button>
      <button type="button" class="btn" id="cancel">Cancel</button>
      <button class="btn primary" id="save">Save gift</button>
    </div>
  </form>
</dialog>
<div id="msg" role="status"></div>

<script>
// ====== SETTINGS ======
// Paste your Apps Script web app URL here (ends in /exec). Leave blank to try a demo with sample data.
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxPSIUTTEeQdgaAHIvFtEcBVyXAJL4HyhKsZ6gW5MTULy7Lv-K5Ktaex3OkgqdTwmJ_mg/exec';
const PAGE_TITLE = 'Christmas List';
// ======================

const $ = id => document.getElementById(id);
let items = [], filter = 'all', editing = null;
const demo = !SCRIPT_URL;
let key = '';
try { key = localStorage.getItem('giftKey') || ''; } catch (e) {}

document.title = PAGE_TITLE; $('title').textContent = PAGE_TITLE;

const money = n => '$' + (n || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
const fixLink = v => { v = String(v || '').trim(); return v && !/^[a-z][a-z0-9+.-]*:/i.test(v) && /^[^\s]+\.[^\s]{2,}/.test(v) ? 'https://' + v : v; };
const isUrl = v => /^https?:\/\//i.test(v);
const num = v => parseFloat(String(v).replace(/[^0-9.]/g, '')) || 0;
function toast(t) { const m = $('msg'); m.textContent = t; m.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => m.classList.remove('show'), 2600); }

function getKey() {
  if (demo) return 'demo';
  if (!key) {
    key = prompt('Enter the edit passcode (set in Code.gs):') || '';
    try { localStorage.setItem('giftKey', key); } catch (e) {}
  }
  return key;
}

async function api(body) {
  if (demo) return {ok: true};
  body.key = getKey(); body.person = person;
  const r = await fetch(SCRIPT_URL + '?payload=' + encodeURIComponent(JSON.stringify(body)));
  const j = await r.json();
  if (j.error) { if (/passcode/i.test(j.error)) { key = ''; try { localStorage.removeItem('giftKey'); } catch (e) {} } throw new Error(j.error); }
  return j;
}

const demoData = {
  Anthony: [
    {row: 2, name: 'Hobbit hole book nook', price: 20, link: 'https://pin.it/2ba4daKXx', notes: '', bought: false},
    {row: 3, name: 'Pandemic', price: 50, link: 'https://a.co/d/002NdcMo', notes: '', bought: false},
    {row: 4, name: 'Blue rosary twine', price: 30, link: 'https://a.co/d/gYCHC65', notes: '', bought: true},
    {row: 5, name: 'St. George poster', price: 24, link: '', notes: '', bought: false},
    {row: 6, name: 'Empires of the North', price: 40, link: 'https://a.co/d/0hwHsLYR', notes: '', bought: false}
  ],
  Mom: [{row: 2, name: 'Slippers', price: 25, link: '', notes: 'Size 8', bought: false}]
};
let people = [], person = '';
try { person = decodeURIComponent(location.hash.slice(1)); } catch (e) {}

async function load() {
  if (demo) {
    people = Object.keys(demoData); if (!demoData[person]) person = people[0];
    items = demoData[person];
    $('sub').textContent = 'Demo mode: add your Apps Script URL in index.html to connect your sheet. Changes here are not saved.';
    return render();
  }
  try {
    const r = await fetch(SCRIPT_URL + '?person=' + encodeURIComponent(person));
    const j = await r.json();
    people = j.people; person = j.person;
    items = j.items.map(i => ({...i, price: num(i.price)}));
    render();
  } catch (e) { $('list').innerHTML = ''; $('empty').hidden = false; $('empty').textContent = 'Could not load the sheet. Check the Apps Script URL and that access is set to Anyone.'; }
}

function pick(n) {
  if (demo) demoData[person] = items;
  person = n;
  try { history.replaceState(null, '', '#' + encodeURIComponent(n)); } catch (e) {}
  load();
}

function renderPeople() {
  const box = $('people'); box.innerHTML = '';
  people.forEach(n => { const b = document.createElement('button'); b.textContent = n; b.setAttribute('aria-pressed', n === person); b.onclick = () => pick(n); box.append(b); });
  const nb = document.createElement('button'); nb.className = 'new'; nb.textContent = 'Add person';
  nb.onclick = async () => {
    const name = (prompt('Name for the new list:') || '').trim(); if (!name) return;
    if (demo) { demoData[name] = []; demoData[person] = items; return pick(name); }
    try { await api({action: 'addPerson', name}); toast('List added'); pick(name.replace(/^_+/, '')); } catch (e) { toast(e.message); }
  };
  box.append(nb);
  document.title = PAGE_TITLE + (person ? ' - ' + person : '');
}

function render() {
  renderPeople();
  const q = $('q').value.toLowerCase();
  const shown = items.filter(i => (filter === 'all' || (filter === 'done') === i.bought) && (i.name + i.notes).toLowerCase().includes(q));
  $('list').innerHTML = '';
  shown.forEach(i => {
    const li = document.createElement('li'); if (i.bought) li.className = 'done';
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.className = 'chk'; cb.checked = i.bought; cb.setAttribute('aria-label', 'Bought: ' + i.name);
    cb.onchange = () => toggle(i, cb.checked);
    const mid = document.createElement('div');
    const nm = document.createElement('div'); nm.className = 'name'; nm.textContent = i.name; mid.append(nm);
    const meta = document.createElement('div'); meta.className = 'meta';
    if (i.link) { if (isUrl(i.link)) { const a = document.createElement('a'); a.href = i.link; a.target = '_blank'; a.rel = 'noopener'; let h = i.link; try { h = new URL(i.link).hostname.replace(/^www\./, ''); } catch (e) {} a.textContent = h; meta.append(a); } else meta.append(i.link); }
    if (i.notes) meta.append((i.link ? ' · ' : '') + i.notes);
    if (meta.childNodes.length) mid.append(meta);
    const right = document.createElement('div'); right.style.textAlign = 'right';
    const p = document.createElement('div'); p.className = 'price'; p.textContent = i.price ? money(i.price) : ''; right.append(p);
    const eb = document.createElement('button'); eb.className = 'edit'; eb.textContent = 'Edit'; eb.onclick = () => openDlg(i); right.append(eb);
    li.append(cb, mid, right); $('list').append(li);
  });
  $('empty').hidden = shown.length > 0; $('empty').textContent = 'No gifts match. Add one with Add gift.';
  $('t-left').textContent = money(items.filter(i => !i.bought).reduce((s, i) => s + i.price, 0));
  $('t-done').textContent = money(items.filter(i => i.bought).reduce((s, i) => s + i.price, 0));
}

async function toggle(i, v) {
  const old = i.bought; i.bought = v; render();
  try { await api({action: 'toggle', row: i.row, bought: v}); }
  catch (e) { i.bought = old; render(); toast(e.message); }
}

function openDlg(i) {
  editing = i || null;
  $('dtitle').textContent = i ? 'Edit gift' : 'Add gift';
  $('f-name').value = i ? i.name : ''; $('f-price').value = i && i.price ? i.price : '';
  $('f-link').value = i ? i.link : ''; $('f-notes').value = i ? i.notes : ''; $('f-bought').checked = i ? i.bought : false;
  $('del').style.display = i ? '' : 'none';
  $('dlg').showModal(); $('f-name').focus();
}

$('add').onclick = () => openDlg(null);
$('cancel').onclick = () => $('dlg').close();
$('q').oninput = render;
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
  filter = b.dataset.f; document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b)); render();
});

$('form').onsubmit = async e => {
  e.preventDefault();
  const d = {action: 'save', row: editing ? editing.row : null, name: $('f-name').value.trim(), price: $('f-price').value, link: fixLink($('f-link').value), notes: $('f-notes').value.trim(), bought: $('f-bought').checked};
  if (!d.name) return;
  $('save').disabled = true;
  try { await api(d); $('dlg').close(); toast('Gift saved'); demo ? demoSave(d) : await load(); }
  catch (err) { toast(err.message); }
  $('save').disabled = false;
};

function demoSave(d) {
  const it = {row: d.row || Date.now(), name: d.name, price: num(d.price), link: d.link, notes: d.notes, bought: d.bought};
  const k = items.findIndex(x => x.row === it.row); k > -1 ? items[k] = it : items.push(it); render();
}

$('del').onclick = async () => {
  if (!editing || !confirm('Delete "' + editing.name + '"?')) return;
  try { await api({action: 'delete', row: editing.row}); $('dlg').close(); toast('Gift deleted'); if (demo) { items = items.filter(x => x !== editing); render(); } else await load(); }
  catch (err) { toast(err.message); }
};

load();
</script>
</body>
</html>
